name: Build

on:
  # Note: GitHub only offers the "Run workflow" button for workflows that exist
  # on the default branch, so manual runs are possible once this is on main.
  workflow_dispatch:
    inputs:
      emby-version:
        description: Emby Server version to build against (blank = the version pinned in build/emby-version.txt)
        required: false
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keyed on the Emby version as well, so a run checking a new Emby release does
# not cancel the one verifying the pinned version.
concurrency:
  group: build-${{ github.ref }}-${{ inputs.emby-version }}
  cancel-in-progress: true

env:
  PROJECT: src/EmbyProxyRouter/EmbyProxyRouter.csproj

jobs:
  # Static check on the workflows themselves. Everything else in this file only
  # reports a mistake by failing a run that took minutes to get there; a typo in
  # an expression or a step key is caught here in seconds. actionlint runs as a
  # pinned release binary rather than an action, so it has no supply chain of
  # its own beyond the download.
  lint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: actionlint
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # build/emby-version.txt is the single source of truth for the pinned
      # version; inputs.* is empty on events that carry no inputs (pull_request).
      #
      # github.sha is not the commit under test on pull_request: it is the
      # ephemeral merge commit GitHub creates for the run, which belongs to no
      # branch and cannot be looked up once the run is over. The build keeps
      # running against that merge - testing the merge result is the point of a
      # pull-request build - but the artifact is named after the commit that was
      # actually pushed, so it can be traced back to one.
      - name: Resolve the build inputs
        id: ctx
        run: |
          set -euo pipefail
          version="${{ inputs.emby-version }}"
          if [ -z "$version" ]; then
            version="$(tr -d '[:space:]' < build/emby-version.txt)"
            echo "No version requested - using the pinned $version"
          else
            echo "Building against the requested $version"
          fi

          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Commit under test: $sha"

          {
            echo "version=$version"
            echo "sha=$sha"
            echo "short_sha=${sha:0:7}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build"
            echo
            echo "- Emby Server \`$version\`"
            echo "- Commit \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      # The reference assemblies are proprietary and deliberately not committed, so
      # every run would otherwise re-download a ~180 MB .deb to keep a few DLLs.
      #
      # The fetch script's hash is part of the key on purpose: a cache entry is
      # immutable, and a hit skips the save. Without it, changing which files the
      # script keeps would leave an incomplete lib/ cached under a key that keeps
      # hitting - and every later run would re-download the .deb to fill the gap.
      - name: Cache Emby assemblies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: lib
          key: emby-refs-${{ steps.ctx.outputs.version }}-${{ hashFiles('build/fetch-emby-refs.sh') }}

      - name: Fetch Emby assemblies
        run: bash build/fetch-emby-refs.sh "${{ steps.ctx.outputs.version }}"

      # The check that actually matters when moving to a new Emby version.
      # Compiling proves little: the four referenced API assemblies rarely change,
      # while the patched method is internal to the server and has changed before.
      # A Harmony postfix that no longer matches never applies - the plugin would
      # install cleanly and silently route nothing.
      - name: Verify the patch target
        run: |
          set -euo pipefail
          dotnet tool install -g ilspycmd --version 9.1.0.7988
          export PATH="$PATH:$HOME/.dotnet/tools"
          bash build/verify-patch-target.sh | tee patch-target.txt
          {
            echo "### Patch target"
            echo '```'
            cat patch-target.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Build
        run: dotnet build "$PROJECT" -c Release --no-restore

      # The plugin ships as one file: Harmony and the translations are embedded.
      # If that ever stops being true, the size check below is what notices.
      - name: Verify the output is a single self-contained plugin DLL
        run: |
          set -euo pipefail
          out=src/EmbyProxyRouter/bin/Release
          dll="$out/EmbyProxyRouter.dll"
          test -f "$dll" || { echo "::error::$dll was not produced"; exit 1; }

          if [ -f "$out/0Harmony.dll" ]; then
            echo "::error::0Harmony.dll was copied next to the plugin; it must stay embedded"
            exit 1
          fi

          size=$(stat -c%s "$dll")
          echo "EmbyProxyRouter.dll: $size bytes"
          # An unembedded Harmony would drop this well below a megabyte.
          if [ "$size" -lt 1000000 ]; then
            echo "::error::plugin DLL is suspiciously small - are the embedded resources missing?"
            exit 1
          fi

      - name: Upload plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EmbyProxyRouter-emby${{ steps.ctx.outputs.version }}-${{ steps.ctx.outputs.short_sha }}
          path: src/EmbyProxyRouter/bin/Release/EmbyProxyRouter.dll
          if-no-files-found: error
