name: CI

# Everything that answers "is this change sound?" - and nothing that produces a
# deliverable. Releasing is release.yml's job, on a tag.
#
# There is no test project in this repository, so the checks below are what
# stands in for one: the workflows are linted, the plugin is compiled against
# the real Emby assemblies, the patched method is asserted to still exist with
# the expected signature, and the output is asserted to still be one file.
on:
  # Note: GitHub only offers the "Run workflow" button for workflows that exist
  # on the default branch. release-check.yml dispatches this workflow by name.
  workflow_dispatch:
    inputs:
      emby-version:
        description: Emby Server version to build against (blank = the version pinned in build/emby-version.txt)
        required: false
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keyed on the Emby version as well, so a run checking a new Emby release does
# not cancel the one verifying the pinned version.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.emby-version }}
  cancel-in-progress: true

env:
  PROJECT: src/EmbyProxyRouter/EmbyProxyRouter.csproj

jobs:
  # Static check on the workflows themselves. Everything else here only reports
  # a mistake by failing a run that took minutes to get there; a typo in an
  # expression or a step key is caught in seconds. actionlint runs as a pinned
  # release binary rather than an action, so it has no supply chain of its own
  # beyond the download.
  lint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build/emby-version.txt is the single source of truth for the pinned
      # version; inputs.* is empty on events that carry no inputs (pull_request).
      #
      # github.sha is not the commit under test on pull_request: it is the
      # ephemeral merge commit GitHub creates for the run, which belongs to no
      # branch and cannot be looked up once the run is over. The checks keep
      # running against that merge - testing the merge result is the point of a
      # pull-request run - but anything labelled with a commit uses the one that
      # was actually pushed, so it can be traced back to one.
      - name: Resolve the build inputs
        id: ctx
        run: |
          set -euo pipefail
          version="${{ inputs.emby-version }}"
          if [ -z "$version" ]; then
            version="$(tr -d '[:space:]' < build/emby-version.txt)"
            echo "No version requested - using the pinned $version"
          else
            echo "Building against the requested $version"
          fi

          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Commit under test: $sha"

          {
            echo "version=$version"
            echo "sha=$sha"
            echo "short_sha=${sha:0:7}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Verifying"
            echo
            echo "- Emby Server \`$version\`"
            echo "- Commit \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      # The reference assemblies are proprietary and deliberately not committed, so
      # every run would otherwise re-download a ~180 MB .deb to keep a few DLLs.
      #
      # The fetch script's hash is part of the key on purpose: a cache entry is
      # immutable, and a hit skips the save. Without it, changing which files the
      # script keeps would leave an incomplete lib/ cached under a key that keeps
      # hitting - and every later run would re-download the .deb to fill the gap.
      - name: Cache Emby assemblies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lib
          key: emby-refs-${{ steps.ctx.outputs.version }}-${{ hashFiles('build/fetch-emby-refs.sh') }}

      - name: Fetch Emby assemblies
        run: bash build/fetch-emby-refs.sh "${{ steps.ctx.outputs.version }}"

      # The check that actually matters when moving to a new Emby version.
      # Compiling proves little on its own: the four referenced API assemblies
      # rarely change, while the patched method is internal to the server and has
      # changed before. A Harmony postfix that no longer matches never applies -
      # the plugin would install cleanly and silently route nothing.
      - name: Verify the patch target
        run: |
          set -euo pipefail
          dotnet tool install -g ilspycmd --version 9.1.0.7988
          export PATH="$PATH:$HOME/.dotnet/tools"
          bash build/verify-patch-target.sh | tee patch-target.txt
          {
            echo "### Patch target"
            echo '```'
            cat patch-target.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Compile
        run: dotnet build "$PROJECT" -c Release --no-restore

      - name: Verify the output is a single self-contained plugin DLL
        run: bash build/verify-single-dll.sh

      # Pull requests verify; they do not publish. A manual run is different: it
      # is how a candidate against a *new* Emby version gets built, and having
      # that DLL to try against a real server is the point of starting one.
      - name: Upload the candidate plugin
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EmbyProxyRouter-emby${{ steps.ctx.outputs.version }}-${{ steps.ctx.outputs.short_sha }}
          path: src/EmbyProxyRouter/bin/Release/EmbyProxyRouter.dll
          if-no-files-found: error
