version: 2

# Both ecosystems open pull requests against main, where ci.yml runs them
# through the full check - fetch, patch-target verification, compile, single-DLL
# assertion. A dependency bump is therefore verified the same way a code change
# is, which is the only reason automating it is safe here.

updates:
  # The actions used by the three workflows. GitHub already reports
  # that checkout, setup-dotnet, cache and upload-artifact v4 target the
  # deprecated Node 20 runtime and are being forced onto Node 24; this is what
  # keeps the eventual v5 bump from having to be noticed by hand.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # One pull request for all of them. They move together in practice, separate
    # pull requests would conflict on the same pinned-SHA lines, and each costs a
    # full CI run to verify.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # Lib.Harmony is the plugin's only NuGet dependency, and it is embedded into
  # the plugin DLL rather than shipped next to it, so a bump changes the artifact
  # itself rather than just a reference. It also patches the CLR at runtime,
  # which is the part of this plugin with the least margin for a silent
  # regression - the patch-target check is what has to pass before such a bump
  # is taken.
  - package-ecosystem: nuget
    directory: "/src/EmbyProxyRouter"
    schedule:
      interval: monthly
    commit-message:
      prefix: build

  # The test project's own dependencies - xunit and the VSTest host. Kept as a
  # separate entry rather than folded into the one above because these ship in
  # nothing: they are build-time only, they cannot affect the artifact, and a
  # bump to them is verified by the tests passing rather than by the
  # patch-target check. Grouped into one pull request for the same reason the
  # actions are - they move together, and each one costs a full CI run.
  - package-ecosystem: nuget
    directory: "/tests/EmbyProxyRouter.Tests"
    schedule:
      interval: monthly
    groups:
      test-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: test
